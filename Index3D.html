<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nigeria Life 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}
#game {
  position: fixed;
  inset: 0;
}
#status {
  position: fixed;
  top: 12px;
  left: 12px;
  color: white;
  background: #111a;
  padding: 10px 14px;
  border-radius: 10px;
  z-index: 5;
}
#controls {
  position: fixed;
  bottom: 22px;
  left: 18px;
  display: grid;
  grid-template-columns: 54px 54px 54px;
  grid-template-rows: 54px 54px 54px;
  gap: 5px;
  z-index: 5;
}
button {
  border: 1px solid #ffffff80;
  background: #182333cc;
  color: white;
  border-radius: 14px;
  font-size: 22px;
  touch-action: none;
}
button:active {
  background: #168b65;
}
#forward { grid-column: 2; grid-row: 1; }
#left { grid-column: 1; grid-row: 2; }
#back { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }

#cameraHint {
  position: fixed;
  bottom: 22px;
  right: 15px;
  color: white;
  background: #111a;
  padding: 12px;
  border-radius: 12px;
  font-size: 12px;
  max-width: 125px;
  text-align: center;
  z-index: 5;
}
#error {
  display: none;
  position: fixed;
  top: 70px;
  left: 10px;
  right: 10px;
  background: #8b0000;
  color: white;
  padding: 12px;
  z-index: 10;
}
</style>
</head>

<body>
<div id="game"></div>
<div id="status">🇳🇬 NIGERIA LIFE 3D<br>Loading world...</div>
<div id="error"></div>

<div id="controls">
  <button id="forward">▲</button>
  <button id="left">◀</button>
  <button id="back">▼</button>
  <button id="right">▶</button>
</div>

<div id="cameraHint">Drag the screen to rotate the camera 360°</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 45, 180);

  const camera = new THREE.PerspectiveCamera(
    65, innerWidth / innerHeight, 0.1, 500
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = false;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('game').appendChild(renderer.domElement);

  // LIGHTING
  scene.add(new THREE.HemisphereLight(0xffffff, 0x64734c, 2));

  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(-20, 40, 20);
  scene.add(sun);

  // MATERIALS
  const materials = {
    grass: new THREE.MeshStandardMaterial({color: 0x579447}),
    road: new THREE.MeshStandardMaterial({color: 0x393d40}),
    line: new THREE.MeshStandardMaterial({color: 0xf7e6a1}),
    concrete: new THREE.MeshStandardMaterial({color: 0xaaa69e}),
    white: new THREE.MeshStandardMaterial({color: 0xf3eee0}),
    skin: new THREE.MeshStandardMaterial({color: 0x92552e}),
    shirt: new THREE.MeshStandardMaterial({color: 0x168b65}),
    trousers: new THREE.MeshStandardMaterial({color: 0x252b40}),
    black: new THREE.MeshStandardMaterial({color: 0x202020}),
    window: new THREE.MeshStandardMaterial({
      color: 0x70c9df,
      metalness: 0.2,
      roughness: 0.25
    })
  };

  function box(w, h, d, material, x, y, z, parent = scene) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d), material
    );
    mesh.position.set(x, y, z);
    parent.add(mesh);
    return mesh;
  }

  // GROUND AND ROAD
  box(300, 0.2, 300, materials.grass, 0, -0.15, 0);
  box(12, 0.08, 180, materials.road, 0, 0, 0);

  for (let z = -85; z <= 85; z += 12) {
    box(0.16, 0.04, 5, materials.line, 0, 0.07, z);
  }

  // SIDEWALKS
  box(3, 0.2, 180, materials.concrete, -7.5, 0.05, 0);
  box(3, 0.2, 180, materials.concrete, 7.5, 0.05, 0);

  // NIGERIAN-STYLE STREET BUILDINGS
  const wallColors = [
    0xe4b878, 0xd8d0b9, 0xd88a62,
    0xe9e1ce, 0xc9b4a1, 0xb7c8b1
  ];

  function building(x, z, w, h, d, color) {
    const wall = new THREE.MeshStandardMaterial({color});

    box(w, h, d, wall, x, h / 2, z);

    // Flat roof
    box(w + 0.3, 0.25, d + 0.3,
      materials.concrete, x, h + 0.12, z);

    // Front windows and doors
    const front = x < 0 ? x + w / 2 + 0.01 : x - w / 2 - 0.01;

    for (let y = 1.8; y < h - 0.5; y += 2.4) {
      for (let side = -1; side <= 1; side += 2) {
        box(0.09, 1.1, 0.9, materials.window,
          front, y, z + side * d * 0.22);
      }
    }

    box(0.12, 2, 1.1, materials.black,
      front, 1, z);
  }

  for (let z = -72; z <= 72; z += 15) {
    const color = wallColors[
      Math.floor(Math.random() * wallColors.length)
    ];

    building(-13, z, 7, 5 + Math.random() * 4, 9, color);
    building(13, z - 5, 7, 5 + Math.random() * 5, 9, color);
  }

  // STREETLIGHTS
  for (let z = -70; z <= 70; z += 24) {
    for (const side of [-1, 1]) {
      box(0.15, 5, 0.15, materials.black,
        side * 8.8, 2.5, z);

      box(1.2, 0.12, 0.15, materials.black,
        side * 9.3, 4.9, z);

      const lamp = new THREE.MeshStandardMaterial({
        color: 0xfff1bb,
        emissive: 0xffd36a,
        emissiveIntensity: 0.5
      });

      box(0.6, 0.15, 0.35, lamp,
        side * 9.8, 4.8, z);
    }
  }

  // SIMPLE CARS
  function makeCar(x, z, color) {
    const car = new THREE.Group();

    box(1.8, 0.65, 3.5,
      new THREE.MeshStandardMaterial({color}),
      0, 0.7, 0, car);

    box(1.45, 0.7, 1.7,
      materials.window, 0, 1.3, -0.15, car);

    for (const wx of [-0.85, 0.85]) {
      for (const wz of [-1.1, 1.1]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.35, 0.35, 0.2, 12),
          materials.black
        );
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(wx, 0.38, wz);
        car.add(wheel);
      }
    }

    car.position.set(x, 0, z);
    scene.add(car);
    return car;
  }

  const cars = [
    makeCar(-2.5, -22, 0xd12d2d),
    makeCar(2.5, 22, 0xe8e8e8),
    makeCar(-2.5, 55, 0x1765c1)
  ];

  // HUMAN-SHAPED PLAYER
  const player = new THREE.Group();

  const body = new THREE.Group();
  player.add(body);

  // Torso
  box(0.72, 0.95, 0.38, materials.shirt,
    0, 1.65, 0, body);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.27, 16, 12),
    materials.skin
  );
  head.position.set(0, 2.35, 0);
  body.add(head);

  // Hair
  const hair = new THREE.Mesh(
    new THREE.SphereGeometry(0.275, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    materials.black
  );
  hair.position.set(0, 2.4, 0);
  body.add(hair);

  // Arms
  const arms = [];
  for (const side of [-1, 1]) {
    const arm = box(0.22, 0.85, 0.24, materials.skin,
      side * 0.5, 1.65, 0, body);
    arm.geometry.translate(0, -0.25, 0);
    arms.push(arm);
  }

  // Legs
  const legs = [];
  for (const side of [-1, 1]) {
    const leg = box(0.27, 0.85, 0.3, materials.trousers,
      side * 0.2, 0.55, 0, body);
    leg.geometry.translate(0, -0.15, 0);
    legs.push(leg);

    box(0.3, 0.18, 0.48, materials.black,
      side * 0.2, 0.12, 0.06, body);
  }

  player.position.set(0, 0, 5);
  scene.add(player);

  // TOUCH CONTROLS
  const keys = {
    forward: false,
    back: false,
    left: false,
    right: false
  };

  for (const name of Object.keys(keys)) {
    const button = document.getElementById(name);

    button.addEventListener('pointerdown', e => {
      e.preventDefault();
      keys[name] = true;
      button.setPointerCapture(e.pointerId);
    });

    const release = e => {
      e.preventDefault();
      keys[name] = false;
    };

    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', () => {
      keys[name] = false;
    });
  }

  // KEYBOARD SUPPORT
  addEventListener('keydown', e => {
    if (e.key === 'w' || e.key === 'ArrowUp') keys.forward = true;
    if (e.key === 's' || e.key === 'ArrowDown') keys.back = true;
    if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
  });

  addEventListener('keyup', e => {
    if (e.key === 'w' || e.key === 'ArrowUp') keys.forward = false;
    if (e.key === 's' || e.key === 'ArrowDown') keys.back = false;
    if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
  });

  // CAMERA ROTATION BY DRAGGING
  let cameraAngle = 0;
  let dragging = false;
  let lastX = 0;

  renderer.domElement.addEventListener('pointerdown', e => {
    dragging = true;
    lastX = e.clientX;
  });

  addEventListener('pointerup', () => dragging = false);
  addEventListener('pointercancel', () => dragging = false);

  renderer.domElement.addEventListener('pointermove', e => {
    if (!dragging) return;
    cameraAngle -= (e.clientX - lastX) * 0.008;
    lastX = e.clientX;
  });

  // MOVEMENT AND GAME LOOP
  const clock = new THREE.Clock();
  let walkTime = 0;

  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    let move = 0;
    let turn = 0;

    if (keys.forward) move = 1;
    if (keys.back) move = -1;
    if (keys.left) turn = 1;
    if (keys.right) turn = -1;

    player.rotation.y += turn * dt * 2.5;

    if (move !== 0) {
      const speed = 4 * move * dt;
      player.position.x -= Math.sin(player.rotation.y) * speed;
      player.position.z -= Math.cos(player.rotation.y) * speed;
      walkTime += dt * 9;

      legs[0].rotation.x = Math.sin(walkTime) * 0.5;
      legs[1].rotation.x = -Math.sin(walkTime) * 0.5;
      arms[0].rotation.x = -Math.sin(walkTime) * 0.35;
      arms[1].rotation.x = Math.sin(walkTime) * 0.35;
    } else {
      legs.forEach(l => l.rotation.x *= 0.8);
      arms.forEach(a => a.rotation.x *= 0.8);
    }

    // Follow the player from behind
    const distance = 7;
    const height = 4;

    const targetX = player.position.x +
      Math.sin(cameraAngle) * distance;
    const targetZ = player.position.z +
      Math.cos(cameraAngle) * distance;

    camera.position.lerp(
      new THREE.Vector3(targetX,
        player.position.y + height, targetZ),
      1 - Math.exp(-5 * dt)
    );

    camera.lookAt(
      player.position.x,
      player.position.y + 1.4,
      player.position.z
    );

    // Basic moving traffic
    cars.forEach((car, i) => {
      car.position.z += (i === 1 ? -1 : 1) * dt * 2;
      if (car.position.z > 85) car.position.z = -85;
      if (car.position.z < -85) car.position.z = 85;
    });

    document.getElementById('status').innerHTML =
      '🇳🇬 NIGERIA LIFE 3D<br>' +
      'Walking: ' + (move !== 0 ? 'YES' : 'NO');

    renderer.render(scene, camera);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  });

  document.getElementById('status').innerHTML =
    '🇳🇬 NIGERIA LIFE 3D<br>World loaded';

  animate();

} catch (error) {
  const box = document.getElementById('error');
  box.style.display = 'block';
  box.textContent =
    'The 3D game could not start. Check your internet connection and reload. ' +
    error.message;
}
</script>
</body>
</html>
