<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">
<title>Nigeria Life</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(
    #87ceeb 0%,
    #87ceeb 45%,
    #479447 45%,
    #479447 100%
  );
}

#sun {
  position: absolute;
  top: 8%;
  right: 12%;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #ffdf55;
}

#world {
  position: absolute;
  width: 100%;
  height: 100%;
  transform-origin: center center;
}

.road {
  position: absolute;
  width: 100%;
  height: 180px;
  top: 55%;
  left: 0;
  background: #555;
  border-top: 6px solid #ddd;
  border-bottom: 6px solid #ddd;
}

.road::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  border-top: 5px dashed white;
}

.house {
  position: absolute;
  width: 110px;
  height: 95px;
  background: #e9b16e;
  border: 4px solid #754a29;
}

.house::before {
  content: "";
  position: absolute;
  top: -38px;
  left: -8px;
  border-left: 59px solid transparent;
  border-right: 59px solid transparent;
  border-bottom: 40px solid #a63828;
}

.house::after {
  content: "";
  position: absolute;
  width: 25px;
  height: 45px;
  left: 39px;
  bottom: 0;
  background: #754a29;
}

#house1 {
  top: 25%;
  left: 12%;
}

#house2 {
  top: 25%;
  right: 12%;
}

#player {
  position: absolute;
  left: 50%;
  top: 60%;
  width: 35px;
  height: 65px;
  transform: translate(-50%, -50%);
  z-index: 5;
}

#head {
  width: 27px;
  height: 27px;
  margin: auto;
  background: #8b542f;
  border-radius: 50%;
}

#body {
  width: 30px;
  height: 35px;
  margin: auto;
  background: #0878e8;
  border-radius: 7px;
}

#hud {
  position: absolute;
  top: 12px;
  left: 12px;
  color: white;
  background: #0009;
  padding: 10px;
  border-radius: 8px;
  z-index: 10;
}

#controls {
  position: absolute;
  bottom: 25px;
  left: 20px;
  display: grid;
  grid-template-columns: 55px 55px 55px;
  grid-template-rows: 55px 55px;
  gap: 5px;
  z-index: 20;
}

button {
  border: 2px solid white;
  background: #111b;
  color: white;
  font-size: 25px;
  border-radius: 12px;
  touch-action: none;
}

button:active {
  background: #1687ff;
}

#up {
  grid-column: 2;
}

#left {
  grid-column: 1;
  grid-row: 2;
}

#down {
  grid-column: 2;
  grid-row: 2;
}

#right {
  grid-column: 3;
  grid-row: 2;
}

#camera {
  position: absolute;
  bottom: 35px;
  right: 20px;
  padding: 12px;
  font-size: 15px;
  z-index: 20;
}

#hint {
  position: absolute;
  top: 75px;
  left: 12px;
  color: white;
  background: #0009;
  padding: 8px;
  border-radius: 6px;
  font-size: 12px;
  z-index: 10;
}
</style>
</head>

<body>

<div id="game">

  <div id="sun"></div>

  <div id="world">

    <div class="house" id="house1"></div>
    <div class="house" id="house2"></div>
    <div class="road"></div>

  </div>

  <div id="player">
    <div id="head"></div>
    <div id="body"></div>
  </div>

  <div id="hud">
    <strong>NIGERIA LIFE</strong><br>
    Money: ₦2,000,000<br>
    <span id="status">Ready to play</span>
  </div>

  <div id="hint">
    Drag your finger to rotate the camera.
  </div>

  <div id="controls">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>

  <button id="camera">↻ Reset Camera</button>

</div>

<script>
const world = document.getElementById("world");
const player = document.getElementById("player");
const statusText = document.getElementById("status");

let x = 0;
let y = 0;
let cameraAngle = 0;
let startX = 0;
let startAngle = 0;
let dragging = false;

function updatePlayer() {
  player.style.left = `calc(50% + ${x}px)`;
  player.style.top = `calc(60% + ${y}px)`;
}

function movePlayer(direction) {
  const speed = 12;

  if (direction === "up") y -= speed;
  if (direction === "down") y += speed;
  if (direction === "left") x -= speed;
  if (direction === "right") x += speed;

  x = Math.max(-window.innerWidth / 2,
      Math.min(window.innerWidth / 2, x));

  y = Math.max(-window.innerHeight / 2,
      Math.min(window.innerHeight / 2, y));

  updatePlayer();
  statusText.textContent = "Moving around Nigeria";
}

function setupButton(id, direction) {
  const button = document.getElementById(id);
  let timer = null;

  function start(e) {
    e.preventDefault();
    movePlayer(direction);

    if (timer) clearInterval(timer);

    timer = setInterval(() => {
      movePlayer(direction);
    }, 100);
  }

  function stop() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  button.addEventListener("pointerdown", start);
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
  button.addEventListener("contextmenu", e => e.preventDefault());
}

setupButton("up", "up");
setupButton("down", "down");
setupButton("left", "left");
setupButton("right", "right");

// Rotate the world by dragging a finger.
const game = document.getElementById("game");

game.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;

  dragging = true;
  startX = e.clientX;
  startAngle = cameraAngle;
});

game.addEventListener("pointermove", e => {
  if (!dragging) return;

  const difference = e.clientX - startX;

  cameraAngle = startAngle + difference * 0.5;

  world.style.transform =
    `rotateY(${cameraAngle}deg)`;

  statusText.textContent =
    "Camera: " + Math.round(cameraAngle % 360) + "°";
});

game.addEventListener("pointerup", () => {
  dragging = false;
});

game.addEventListener("pointercancel", () => {
  dragging = false;
});

document.getElementById("camera").addEventListener(
  "click", () => {
    cameraAngle = 0;
    world.style.transform = "rotateY(0deg)";
    statusText.textContent = "Camera reset";
  }
);

window.addEventListener("resize", updatePlayer);
</script>

</body>
</html>
